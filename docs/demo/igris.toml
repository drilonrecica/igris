# igris.toml for the README demo (`make demo`). Only the keys that differ
# from the defaults are set.

plan = "tasks.md"
needs_input_after = "20s"

[run]
# Each task works in its own worktree and writes one script: run whatever
# scripts are there (none written fails too).
verify = 'for f in *.sh; do sh "$f" || exit 1; done'
commit = "ask"                    # the question answered on camera

[tui]
theme = "dark"                    # same colors in every recording
