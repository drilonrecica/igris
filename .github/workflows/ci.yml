name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, no secrets, no publishing: releases stay manual (decisions.md P0-04/P0-07).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed on:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -timeout 120s ./...

  # A short run of every fuzz target (decisions.md V06-P1, V06-05). A failing
  # input is printed so it can be committed as a regression seed; nothing is
  # uploaded.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz FUZZTIME=30s
      - name: Failing inputs
        if: failure()
        run: |
          git status --porcelain --untracked-files=all -- '*/testdata/fuzz/*' | while read -r _ f; do
            echo "== $f"; cat "$f"; echo
          done

  # The release build, made on two different runners, must give identical
  # binaries (decisions.md V06-P1). Each runner builds all four targets with
  # the release config; compare checks the hashes, passed as job outputs.
  repro-linux:
    runs-on: ubuntu-latest
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: build --snapshot --clean
      - id: sums
        run: |
          { echo 'sums<<EOF'; (cd dist && shasum -a 256 -- */igris | sort -k2); echo EOF; } >> "$GITHUB_OUTPUT"

  repro-macos:
    runs-on: macos-latest
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: build --snapshot --clean
      - id: sums
        run: |
          { echo 'sums<<EOF'; (cd dist && shasum -a 256 -- */igris | sort -k2); echo EOF; } >> "$GITHUB_OUTPUT"

  repro:
    needs: [repro-linux, repro-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Compare
        env:
          LINUX: ${{ needs.repro-linux.outputs.sums }}
          MACOS: ${{ needs.repro-macos.outputs.sums }}
        run: |
          printf 'built on linux:\n%s\n\nbuilt on macos:\n%s\n' "$LINUX" "$MACOS"
          test "$(printf '%s\n' "$LINUX" | wc -l)" -eq 4 || { echo "want 4 binaries"; exit 1; }
          test "$LINUX" = "$MACOS" || { echo "the release build is not reproducible"; exit 1; }
